<!-- Section Layout Start -->

{% assign current_lang = page.lang | default: 'fr' %}

<!doctype html>
<html lang="{{ current_lang }}">

  {% include head.html %}

  <body
    id="page-top"
    data-spy="scroll"
    data-target=".navbar-fixed-top"
    data-offset="151"
  >
    {% include navigation.html %}

    {% include header.html %}

    <section id="{{ page.section-type }}" class="container content-section text-center">
      <div class="row justify-content-center">
        <div class="col-12">{{ page.content | markdownify }}</div>
      </div>
    </section>

    {% include footer.html %}

    {% include js.html %}

  </body>
</html>

<!-- Section Layout End -->
